name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}   # update-ons-data.yml runs this after a data commit (its
                          # GITHUB_TOKEN push can't trigger the push event above)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>marcushowarth</username>
                <password>${env.PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Test
        run: mvn test
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Publish to GitHub Packages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: mvn deploy -DskipTests
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      # Event-driven replacement for the apps' old weekly redeploy schedules
      # (kanban #1009): every new SNAPSHOT redeploys the apps that bundle it.
      # Cross-repo, so it needs a PAT: fine-grained, Actions read/write on
      # these two repos only.
      - name: Redeploy downstream apps
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          for repo in fin-optics-api real-retro-api; do
            gh workflow run deploy.yml -R marcushowarth/$repo --ref main
          done
