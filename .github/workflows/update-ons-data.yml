name: Update ONS price index data

# Weekly rather than tied to ONS's exact (variable) release date — the gate
# below makes a no-op run cheap, so checking weekly just catches the new
# month sooner than guessing a fixed day and risking a month's lag.
on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday, 06:00 UTC
  workflow_dispatch: {}

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      # One series per job so a bad fetch/gate for one never blocks the
      # other — matches PriceIndexDatasetLoader treating each series
      # independently (kanban #981). Serialised (not parallel): both jobs
      # commit+push to the same branch, and parallel pushes would race.
      max-parallel: 1
      matrix:
        include:
          - name: RPI CHAW
            cdid: chaw
            csv_path: rpi/src/main/resources/eu/howarth/fin/rpi/ons-chaw.csv
          - name: CPI D7BT
            cdid: d7bt
            csv_path: rpi/src/main/resources/eu/howarth/fin/priceindex/ons-d7bt.csv

    steps:
      - uses: actions/checkout@v6

      - name: Fetch latest ONS ${{ matrix.name }} data
        env:
          ONS_URL: https://www.ons.gov.uk/generator?format=csv&uri=/economy/inflationandpriceindices/timeseries/${{ matrix.cdid }}/mm23
          CDID: ${{ matrix.cdid }}
        run: |
          curl -sL "$ONS_URL" -o /tmp/ons-latest.csv
          if ! grep -qi "\"CDID\",\"${CDID}\"" /tmp/ons-latest.csv; then
            echo "::error::Fetched file doesn't look like ONS ${CDID} CSV — aborting"
            exit 1
          fi

      - name: Gate — only proceed if a new row was added
        id: gate
        env:
          CSV_PATH: ${{ matrix.csv_path }}
        run: |
          OLD_LINES=$(wc -l < "$CSV_PATH")
          NEW_LINES=$(wc -l < /tmp/ons-latest.csv)
          echo "old=$OLD_LINES new=$NEW_LINES"
          if [ "$NEW_LINES" -le "$OLD_LINES" ]; then
            echo "No new row since last refresh — nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Replace bundled CSV
        if: steps.gate.outputs.proceed == 'true'
        env:
          CSV_PATH: ${{ matrix.csv_path }}
        run: cp /tmp/ons-latest.csv "$CSV_PATH"

      - uses: actions/setup-java@v5
        if: steps.gate.outputs.proceed == 'true'
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Test rpi module with refreshed data
        if: steps.gate.outputs.proceed == 'true'
        run: mvn test -pl rpi

      - name: Commit and push
        if: steps.gate.outputs.proceed == 'true'
        env:
          CSV_PATH: ${{ matrix.csv_path }}
          SERIES_NAME: ${{ matrix.name }}
        run: |
          LATEST_MONTH=$(grep -E '^"[0-9]{4} [A-Z]{3}"' "$CSV_PATH" | tail -1 | cut -d'"' -f2)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase   # other matrix job may have just committed the sibling series
          git add "$CSV_PATH"
          git commit -m "data: refresh ONS ${SERIES_NAME} to ${LATEST_MONTH}"
          git push
